# configs/default.yaml
# Minimal unified config for Beacon system.
# Current validated backend:
# - OpenRouter (OpenAI-compatible)
# - Qwen model family
#
# Rules:
# - env may override model.*
# - env may override run.outputs_dir
# - test scripts may load this file directly without CLI preprocessing

run:
  seed: 0
  max_rounds: 2
  use_verifier: true
  outputs_dir: ${env:OUTPUTS_DIR,outputs/runs}

reader:
  enable_global: true
  validation_filter: true
  max_local_nodes: 400
  max_global_inline: null

model:
  provider: openai_compat
  base_url: ${env:MODEL_BASE_URL,https://openrouter.ai/api/v1}
  api_key: ${env:MODEL_API_KEY}
  model_name: ${env:MODEL_NAME,qwen/qwen3-32b}
  timeout_s: 120
  params:
    temperature: 0.2
    top_p: 0.95
    max_tokens: 2048

adapter:
  name: smoke
  params:
    repo_root: .
    target_file: null
    target_qualname: null
    spec: ""
    run_cmd: "pytest -q"
    work_dir: null
