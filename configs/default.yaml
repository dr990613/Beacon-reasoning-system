# configs/default.yaml
# Minimal unified config for Beacon system.
# Current validated backend:
# - OpenRouter (OpenAI-compatible)
# - Qwen model family
#
# Rules:
# - env may override model.*
# - env may override run.outputs_dir
# - test scripts may load this file directly without CLI preprocessing

run:
  seed: 0
  max_rounds: 2
  use_verifier: true
  outputs_dir: ${env:OUTPUTS_DIR,outputs/runs}

reader:
  enable_global: true
  validation_filter: true
  max_local_nodes: 400
  max_global_inline: null

model:
  provider: openai_compat
  base_url: "https://openrouter.ai/api/v1"
  api_key: ""
  model_name: "qwen/qwen3-coder-next"

  timeout_s: 120
  params:
    temperature: 0.2
    top_p: 0.95
    max_tokens: 4096

adapter:
  name: smoke
  params:
    repo_root: .
    target_file: null
    target_qualname: null
    spec: ""
    run_cmd: "pytest -q"
    work_dir: null
